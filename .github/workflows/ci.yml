name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

  e2e:
    name: Playwright (critical paths)
    runs-on: ubuntu-latest
    # E2E needs credentials. `secrets` is not a valid context in any `if:`
    # expression on `workflow_dispatch`/`push` (GitHub rejects the whole file at
    # validation), so the gate happens in shell where env vars carry the secret.
    # If E2E_BASE_URL is unset we skip the run without failing the job.
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run critical-path E2E
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
          E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_LESSON_URL: ${{ secrets.E2E_LESSON_URL }}
          E2E_ASSIGNMENT_URL: ${{ secrets.E2E_ASSIGNMENT_URL }}
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            echo "::notice::E2E_BASE_URL not set — skipping Playwright."
            exit 0
          fi
          npx playwright test
