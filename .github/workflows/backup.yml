name: Nightly Database Backup

on:
  schedule:
    # 03:17 UTC daily — off the :00/:30 marks so it doesn't collide with
    # everyone else's cron.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pg_dump
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Dump + upload to R2
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          set -euo pipefail
          # The Supabase pooler URL looks like
          #   postgresql://postgres.<ref>:<pw>@aws-0-<region>.pooler.supabase.com:5432/postgres
          DB_URL="$SUPABASE_DB_URL"
          # Strip the pooler for pg_dump (direct host preferred for dumps).
          HOST=$(echo "$DB_URL" | sed -E 's#.*@([^:]+):.*#\1#')
          PORT=$(echo "$DB_URL" | sed -E 's#.*:([0-9]+)/.*#\1#')
          USER=$(echo "$DB_URL" | sed -E 's#.*//([^:]+):.*#\1#')
          PASS=$(echo "$DB_URL" | sed -E 's#.*//[^:]+:([^@]+)@.*#\1#')
          DB="postgres"

          TS=$(date -u +%Y-%m-%d)
          mkdir -p backup
          PGPASSWORD="$PASS" pg_dump -h "$HOST" -p "$PORT" -U "$USER" -d "$DB" \
            -F c -Z 6 -f "backup/$TS.dump"

          # Upload via the app's aws-sdk helper (runners no longer ship Docker,
          # so the old `docker run amazon/aws-cli` approach broke).
          npx tsx scripts/s3.ts put "$R2_BACKUP_BUCKET" "db/$TS.dump" "backup/$TS.dump"

      - name: Retention — prune old dailies/monthlies
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          # List all db/*.dump keys, keep latest 30 dailies and latest 12 that
          # fall on the 1st of a month; delete the rest.
          npx tsx scripts/s3.ts list "$R2_BACKUP_BUCKET" "db/" > /tmp/dbkeys
          python3 - <<'EOF'
          import os, re, subprocess, sys
          keys = []
          for line in open('/tmp/dbkeys'):
              m = re.search(r'db/([0-9-]+)\.dump', line.strip())
              if m: keys.append(m.group(1))
          keys.sort()
          dailies = keys[-30:]
          monthlies = [k for k in keys if k.endswith('-01')][-12:]
          keep = set(dailies + monthlies)
          env = os.environ.copy()
          to_delete = [k for k in keys if k not in keep]
          for k in to_delete:
              subprocess.run(
                  ['npx', 'tsx', 'scripts/s3.ts', 'rm', env['R2_BACKUP_BUCKET'], f'db/{k}.dump'],
                  check=True)
          print(f'pruned {len(to_delete)} old backups; keeping {len(keep)}')
          EOF

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Backups <backups@plms.local>\",\"to\":[\"$ALERT_EMAIL\"],\"subject\":\"❌ PLMS nightly backup FAILED\",\"text\":\"The nightly database backup failed. Check the GitHub Actions run: https://github.com/drsarthakpsychology/bind-lms-platform/actions\"}"
