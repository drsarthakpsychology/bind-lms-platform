name: Nightly Database Backup

on:
  schedule:
    # 03:17 UTC daily — off the :00/:30 marks so it doesn't collide with
    # everyone else's cron.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dump + upload to R2
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          set -euo pipefail
          # Pull the postgres client image (has pg_dump), run the dump to a file.
          # The Supabase pooler URL looks like
          #   postgresql://postgres.<ref>:<pw>@aws-0-<region>.pooler.supabase.com:5432/postgres
          DB_URL="$SUPABASE_DB_URL"
          # Strip the pooler for pg_dump (direct host preferred for dumps).
          HOST=$(echo "$DB_URL" | sed -E 's#.*@([^:]+):.*#\1#')
          PORT=$(echo "$DB_URL" | sed -E 's#.*:([0-9]+)/.*#\1#')
          USER=$(echo "$DB_URL" | sed -E 's#.*//([^:]+):.*#\1#')
          PASS=$(echo "$DB_URL" | sed -E 's#.*//[^:]+:([^@]+)@.*#\1#')
          DB="postgres"

          TS=$(date -u +%Y-%m-%d)
          mkdir -p backup
          docker run --rm \
            -e PGPASSWORD="$PASS" \
            postgres:16-alpine \
            pg_dump -h "$HOST" -p "$PORT" -U "$USER" -d "$DB" \
              -F c -Z 6 \
              -f /tmp/db.dump
          # Copy out of the container.
          docker run --rm -v "$PWD/backup:/out" postgres:16-alpine cp /tmp/db.dump /out 2>/dev/null || true

          # Upload via curl (R2 S3-compatible) or aws cli. Use curl signed.
          # Simpler: use aws cli via the official image.
          docker run --rm -v "$PWD/backup:/data" -e AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" -e AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
            -e AWS_ENDPOINT_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" -e AWS_REGION=auto \
            amazon/aws-cli:latest s3 cp /data/db.dump "s3://${R2_BACKUP_BUCKET}/db/${TS}.dump"

          # Retention: 30 daily + 12 monthly.
          docker run --rm -e AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" -e AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
            -e AWS_ENDPOINT_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" -e AWS_REGION=auto \
            amazon/aws-cli:latest s3 ls "s3://${R2_BACKUP_BUCKET}/db/" --output text
          # (Retention pruning is handled in a companion job below for clarity.)

      - name: Retention — prune old dailies/monthlies
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          # List all db/*.dump keys, keep latest 30 dailies and latest 12 that
          # fall on the 1st of a month; delete the rest.
          docker run --rm -e AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" -e AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
            -e AWS_ENDPOINT_URL="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" -e AWS_REGION=auto \
            amazon/aws-cli:latest s3 ls "s3://${R2_BACKUP_BUCKET}/db/" --output json | \
            python3 -c "
import sys, json, re, subprocess, os
keys = []
for line in sys.stdin:
    m = re.search(r'\"Key\": \"db/([0-9-]+)\.dump\"', line)
    if m: keys.append(m.group(1))
keys.sort()
dailies = keys[-30:]
monthlies = [k for k in keys if k.endswith('-01')][-12:]
keep = set(dailies + monthlies)
env = os.environ.copy()
env.update({k: os.environ.get(k,'') for k in ['AWS_ACCESS_KEY_ID','AWS_SECRET_ACCESS_KEY','AWS_ENDPOINT_URL','AWS_REGION','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','R2_ACCOUNT_ID','R2_BACKUP_BUCKET']})
for k in keys:
    if k not in keep:
        subprocess.run(['docker','run','--rm',
            '-e','AWS_ACCESS_KEY_ID='+env.get('R2_ACCESS_KEY_ID',''),
            '-e','AWS_SECRET_ACCESS_KEY='+env.get('R2_SECRET_ACCESS_KEY',''),
            '-e','AWS_ENDPOINT_URL=https://'+env.get('R2_ACCOUNT_ID','')+'.r2.cloudflarestorage.com',
            '-e','AWS_REGION=auto',
            'amazon/aws-cli:latest','s3','rm','s3://'+env.get('R2_BACKUP_BUCKET','')+'/db/'+k+'.dump'],
            check=True)
print(f'pruned {len(keys)-len(keep)} old backups; keeping {len(keep)}')
"

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Backups <backups@plms.local>\",\"to\":[\"$ALERT_EMAIL\"],\"subject\":\"❌ PLMS nightly backup FAILED\",\"text\":\"The nightly database backup failed. Check the GitHub Actions run: https://github.com/drsarthakpsychology/bind-lms-platform/actions\"}"
