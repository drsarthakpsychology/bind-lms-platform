name: Weekly Backup Verification

on:
  schedule:
    # Sunday 04:17 UTC — verify the week's backups actually restore.
    - cron: "17 4 * * 0"
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run verify-backup
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          npm ci
          npx tsx scripts/verify-backup.ts

      - name: Alert on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          curl -s -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"Backups <backups@plms.local>\",\"to\":[\"$ALERT_EMAIL\"],\"subject\":\"❌ PLMS weekly backup VERIFICATION FAILED\",\"text\":\"The weekly restore-verification failed. Backups may be broken. Check: https://github.com/drsarthakpsychology/bind-lms-platform/actions\"}"
